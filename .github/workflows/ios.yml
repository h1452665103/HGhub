name: iOS unsigned ipa
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - run: brew install xcodegen cocoapods
      - run: pnpm install --frozen-lockfile

      # 仓库锁的 2.10.1 没有 ios build --no-sign，用 dlx 拉 2.12.4
      - name: 生成 iOS 工程
        run: pnpm dlx @tauri-apps/cli@2.12.4 ios init --ci

      - name: 构建未签名 ipa
        run: pnpm dlx @tauri-apps/cli@2.12.4 ios build --no-sign --ignore-version-mismatches

      - name: 收集产物
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$IPA"
          ls -lh "$IPA"
          mkdir -p artifacts
          cp "$IPA" artifacts/HGhub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-unsigned-ipa
          path: artifacts/HGhub-unsigned.ipa
          if-no-files-found: error
