name: iOS unsigned ipa
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - run: brew install xcodegen cocoapods
      - run: pnpm install --frozen-lockfile

      - name: 升级 Tauri CLI（2.10.1 没有 --no-sign）
        run: pnpm add -D @tauri-apps/cli@2.12.4

      - name: 环境诊断
        run: |
          {
            echo '### 环境'
            echo '```'
            xcodebuild -version
            xcrun simctl list runtimes | grep -i '^iOS' || true
            rustup target list --installed | grep ios || true
            pnpm tauri --version || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 前端构建
        run: pnpm build

      - name: 生成 iOS 工程
        run: pnpm tauri ios init --ci

      - name: 构建未签名 ipa
        run: |
          set +e
          pnpm tauri ios build --no-sign --ignore-version-mismatches 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            MSG=$(tail -n 40 build.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' | head -c 4000)
            echo "::error title=iOS build failed::${MSG}"
            { echo "### 构建失败 (exit $status)"; echo '```'; tail -n 150 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: 收集产物
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$IPA"
          ls -lh "$IPA"
          mkdir -p artifacts
          cp "$IPA" artifacts/HGhub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-unsigned-ipa
          path: artifacts/HGhub-unsigned.ipa
          if-no-files-found: error
