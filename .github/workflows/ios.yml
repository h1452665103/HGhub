name: iOS unsigned ipa
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - run: brew install xcodegen cocoapods
      - run: pnpm install --frozen-lockfile

      - name: 检查 iOS runtime
        run: |
          {
            echo "### 环境诊断"
            echo '```'
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-path || true
            xcrun simctl list runtimes || true
            rustup target list --installed | grep ios || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! xcrun simctl list runtimes 2>/dev/null | grep -q '^iOS'; then
            echo "缺少 iOS runtime，开始下载（可能 10 分钟以上）"
            xcodebuild -downloadPlatform iOS
          fi

      - name: 生成 iOS 工程
        run: pnpm dlx @tauri-apps/cli@2.12.4 ios init --ci

      - name: 构建未签名 ipa
        run: |
          set +e
          pnpm dlx @tauri-apps/cli@2.12.4 ios build --no-sign --ignore-version-mismatches 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### 构建失败 (exit $status)"
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: 收集产物
        run: |
          set -euo pipefail
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$IPA"
          ls -lh "$IPA"
          mkdir -p artifacts
          cp "$IPA" artifacts/HGhub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-unsigned-ipa
          path: artifacts/HGhub-unsigned.ipa
          if-no-files-found: error
